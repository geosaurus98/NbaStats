name: ESPN probe
on:
  push:
    branches: [claude/youthful-heisenberg-ag3b0v]
    paths: [scripts/probe.ts, .github/workflows/probe.yml]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx --yes tsx scripts/probe.ts
