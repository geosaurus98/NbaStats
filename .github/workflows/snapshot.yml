name: Season snapshot
# Rebuilds the bundled data for completed seasons and commits it.
on:
  push:
    branches: [claude/youthful-heisenberg-ag3b0v]
    paths: [scripts/snapshot.ts, scripts/teammates.ts, src/api/normalize.ts, src/lib/pbpStats.ts, .github/workflows/snapshot.yml]
  workflow_dispatch:
    inputs:
      seasons:
        description: Season end-years, space separated
        default: '2026 2025'

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx --yes tsx scripts/snapshot.ts ${{ github.event.inputs.seasons || '2026 2025' }}
      - run: npx --yes tsx scripts/teammates.ts
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add src/data
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update season snapshots"
          git push
